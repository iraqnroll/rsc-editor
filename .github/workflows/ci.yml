name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Without this the integration suites skip themselves and CI goes green
    # having proved much less than it looks like it did.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rsc
          POSTGRES_PASSWORD: rsc
          POSTGRES_DB: rsc_editor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The service container only creates the dev database; the test suite
      # uses a separate one so it can never truncate working data.
      - name: Create test database
        run: |
          PGPASSWORD=rsc psql -h localhost -U rsc -d rsc_editor \
            -c 'CREATE DATABASE rsc_editor_test OWNER rsc'

      - name: Migrate
        run: pnpm db:migrate

      # Typecheck runs BEFORE tests, deliberately.
      #
      # vitest runs through esbuild, which strips types without checking them.
      # An import of a name a module never exported becomes `undefined` at
      # runtime rather than an error -- that exact mistake once turned every
      # buffer offset into NaN and surfaced as a baffling "bad magic" failure
      # far from its cause. Green tests do not imply type correctness.
      # See docs/DECISIONS.md section 7.
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      # The fidelity gate: all 596 landscape files in fixtures/data204 must
      # re-encode byte-identically. Zero tolerance -- a regression here means
      # the editor silently corrupts people's maps on export.
      - name: Test
        run: pnpm -r test
